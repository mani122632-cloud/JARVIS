plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
}

// Stage 46.2: offline Persian TTS (sherpa-onnx). The sherpa source set is compiled only when the files that
// tools/install-offline-assets.sh downloads are present, so the project still builds (and JARVIS reports
// "engine missing" instead of crashing) without them.
def sherpaKotlinApi = file("src/sherpa/java/com/k2fsa/sherpa/onnx/Tts.kt")
def sherpaNativeLib = file("src/main/jniLibs/arm64-v8a/libsherpa-onnx-jni.so")
def sherpaPresent = sherpaKotlinApi.exists() && sherpaNativeLib.exists()

android {
    namespace "com.jarvis.assistant"
    compileSdk 35

    defaultConfig {
        applicationId "com.jarvis.assistant"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "0.1"

        // Only the ABI installed by tools/install-offline-assets.sh (ABIS=... to change). Keeps the APK small.
        ndk { abiFilters "arm64-v8a" }
    }

    sourceSets {
        main {
            if (sherpaPresent) java.srcDir "src/sherpa/java"
        }
    }

    // The ONNX voice is opened with openFd() (cheap change detection) and is not compressible anyway.
    androidResources { noCompress "onnx" }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    kotlinOptions {
        jvmTarget = "21"
    }
}

dependencies {
    // Stage 44: offline wake word (Apache-2.0, no API key, no cloud).
    implementation "net.java.dev.jna:jna:5.13.0@aar"
    implementation "com.alphacephei:vosk-android:0.3.47"
    // Stage 46.2: no Maven dependency for TTS. sherpa-onnx comes as src/sherpa/.../Tts.kt + src/main/jniLibs/<abi>/*.so.
}

if (!sherpaPresent) {
    logger.warn("JARVIS: sherpa-onnx files not found -> building WITHOUT offline TTS (see INTEGRATION.md, tools/install-offline-assets.sh)")
}
