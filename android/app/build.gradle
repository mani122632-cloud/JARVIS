plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
}

// Stage 46.2: offline Persian TTS (sherpa-onnx). The sherpa source set is compiled only when the files that
// tools/install-offline-assets.sh downloads are present, so the project still builds (and JARVIS reports
// "engine missing" instead of crashing) without them.
def sherpaKotlinApi = file("src/sherpa/java/com/k2fsa/sherpa/onnx/Tts.kt")
def sherpaNativeLib = file("src/main/jniLibs/arm64-v8a/libsherpa-onnx-jni.so")
def sherpaPresent = sherpaKotlinApi.exists() && sherpaNativeLib.exists()

// Offline Persian STT (sherpa-onnx ASR). src/sherpa-stt is compiled only when tools/install-persian-stt.sh has
// installed the sherpa-onnx ASR Kotlin API next to Tts.kt; otherwise JARVIS reports "STT model missing" at runtime.
def sherpaAsrKotlinApi = file("src/sherpa/java/com/k2fsa/sherpa/onnx/OfflineRecognizer.kt")
def sherpaAsrStream = file("src/sherpa/java/com/k2fsa/sherpa/onnx/OfflineStream.kt")
def sherpaAsrPresent = sherpaPresent && sherpaAsrKotlinApi.exists() && sherpaAsrStream.exists()

android {
    namespace "com.jarvis.assistant"
    compileSdk 35

    defaultConfig {
        applicationId "com.jarvis.assistant"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "0.1"

        // Only the ABI installed by tools/install-offline-assets.sh (ABIS=... to change). Keeps the APK small.
        ndk { abiFilters "arm64-v8a" }
    }

    sourceSets {
        main {
            if (sherpaPresent) java.srcDir "src/sherpa/java"
            if (sherpaAsrPresent) java.srcDir "src/sherpa-stt/java"
        }
    }

    // The ONNX voice is opened with openFd() (cheap change detection) and is not compressible anyway.
    androidResources { noCompress "onnx" }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    kotlinOptions {
        jvmTarget = "21"
    }
}

dependencies {
    // Stage 44: offline wake word (Apache-2.0, no API key, no cloud).
    implementation "net.java.dev.jna:jna:5.13.0@aar"
    implementation "com.alphacephei:vosk-android:0.3.47"
    // Stage 46.2: no Maven dependency for TTS. sherpa-onnx comes as src/sherpa/.../Tts.kt + src/main/jniLibs/<abi>/*.so.
}

if (!sherpaPresent) {
    logger.warn("JARVIS: sherpa-onnx files not found -> building WITHOUT offline TTS (see INTEGRATION.md, tools/install-offline-assets.sh)")
}
def sttModelFile = file("src/main/assets/stt-fa/model.onnx")
def sttTokensFile = file("src/main/assets/stt-fa/tokens.txt")
if (sttModelFile.exists() || sttTokensFile.exists()) {
    if (!sttModelFile.exists() || !sttTokensFile.exists()) {
        logger.warn("JARVIS: assets/stt-fa needs BOTH model.onnx and tokens.txt")
    }
    if (!file("src/main/jniLibs/arm64-v8a/libonnxruntime.so").exists()) {
        logger.warn("JARVIS: jniLibs/arm64-v8a/libonnxruntime.so is missing; libsherpa-onnx-jni.so cannot load without it")
    }
    if (!sherpaAsrPresent) {
        logger.warn("JARVIS: the STT model is bundled but the sherpa-onnx ASR Kotlin API is not -> STT stays disabled")
    }
}
if (!sherpaAsrPresent) {
    logger.warn("JARVIS: sherpa-onnx ASR API not found -> building WITHOUT offline Persian STT (run tools/install-persian-stt.sh)")
}
